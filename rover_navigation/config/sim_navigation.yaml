# Nav2 parameters for the Gazebo simulation (Jazzy, navigation2 1.3.x).
# Used by sim_nav.launch.py. The hardware file navigation.yaml is untouched.
#
# Frames: map -> odom (static identity in sim) -> base_link (ekf_local).
# base_link sits about 0.53 m above the ground in Gazebo (measured with
# `gz model -m rover -p` on the settled rover: z = 0.529), and the EKF runs
# in two_d_mode, so odom/map z = 0 is base_link height, NOT ground level.
# Costmap heights are therefore expressed relative to base_link:
#   ground                      z = -0.53
#   min_obstacle_height -0.43   (0.10 m above ground)
#   max_obstacle_height  0.97   (1.50 m above ground)
#
# Footprint (base_link frame, x forward): 1.2 x 0.9 m rectangle.
#   Chassis mesh bounds (coarse/Chassis.STL, rotated -90 deg into base_link):
#     x +-0.568, y +-0.354. Wheel joints at x +-0.384..0.416, y +-0.314;
#     wheel radius 0.096, width 0.1215 outward, so wheels reach x +-0.51 and
#     y about +-0.44. Rounded up to x +-0.60, y +-0.45.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    # ms the BT waits for a server to ACK a goal. Nav2's default of 20 ms made
    # the 1 Hz replanning ComputePathToPose time out (goal aborted at 4 m)
    # while a second Gazebo sim was loading the laptop.
    default_server_timeout: 200
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Empty strings: use Nav2's packaged
    # navigate_to_pose_w_replanning_and_recovery.xml and
    # navigate_through_poses_w_replanning_and_recovery.xml.
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    odom_topic: /odometry/filtered
    # Publish geometry_msgs/TwistStamped (diff_drive_controller 4.x only
    # accepts stamped commands).
    enable_stamped_cmd_vel: true
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 20.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.3

    # Regulated Pure Pursuit: cheap on a laptop CPU, predictable on a skid
    # steer, and rotates in place to face the path before driving.
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 1.0
      min_lookahead_dist: 0.5
      max_lookahead_dist: 1.8
      lookahead_time: 2.0
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.3
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 0.8
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.6
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.6
      max_angular_accel: 1.5
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      use_fixed_curvature_lookahead: false

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.3
    rotational_acc_lim: 1.5

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [0.8, 0.0, 1.5]
    max_decel: [-1.0, 0.0, -1.5]
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 0.3
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[0.60, 0.45], [0.60, -0.45], [-0.60, -0.45], [-0.60, 0.45]]"
      footprint_padding: 0.0
      track_unknown_space: false
      always_send_full_costmap: true
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        origin_z: -0.53
        z_resolution: 0.1
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        max_obstacle_height: 0.97
        combination_method: 1
        observation_sources: zed_cloud
        # Cloud is stamped Front_Zed_left_camera_frame (x fwd, z up), 320x180
        # at ~10 Hz; Nav2 transforms it via TF, so no sensor_frame override.
        # expected_update_rate 0 = never mark the source as stale.
        zed_cloud:
          topic: /Front_Zed/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: -0.43
          max_obstacle_height: 0.97
          obstacle_min_range: 0.0
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 10.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.6
        cost_scaling_factor: 3.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      transform_tolerance: 0.3
      rolling_window: true
      width: 30
      height: 30
      resolution: 0.1
      footprint: "[[0.60, 0.45], [0.60, -0.45], [-0.60, -0.45], [-0.60, 0.45]]"
      footprint_padding: 0.0
      track_unknown_space: false
      always_send_full_costmap: true
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        origin_z: -0.53
        z_resolution: 0.1
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        max_obstacle_height: 0.97
        combination_method: 1
        observation_sources: zed_cloud
        # Cloud is stamped Front_Zed_left_camera_frame (x fwd, z up), 320x180
        # at ~10 Hz; Nav2 transforms it via TF, so no sensor_frame override.
        # expected_update_rate 0 = never mark the source as stale.
        zed_cloud:
          topic: /Front_Zed/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: -0.43
          max_obstacle_height: 0.97
          obstacle_min_range: 0.0
          obstacle_max_range: 8.0
          raytrace_min_range: 0.0
          raytrace_max_range: 10.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # 0.8 > circumscribed radius (0.75) so SmacPlanner2D's centre-cell
        # check keeps the footprint corners off obstacles (with 0.6 the
        # planner logs "inflation is not set sufficiently"). Local stays 0.6.
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
